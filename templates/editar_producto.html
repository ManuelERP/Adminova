<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editar Producto | Adminova ERP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#eef2f7;
padding:40px;
}

.contenedor{
max-width:700px;
margin:auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h1{
margin-bottom:25px;
color:#0f172a;
}

input{
width:100%;
padding:12px;
margin-bottom:18px;
border:1px solid #dcdcdc;
border-radius:8px;
font-size:15px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#1d4ed8;
}

.volver{
display:inline-block;
margin-top:20px;
text-decoration:none;
color:white;
background:#0f172a;
padding:10px 20px;
border-radius:8px;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>✏️ Editar Producto</h1>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="nombre"
value="{{ producto.nombre }}"
required>

<input
type="text"
name="descripcion"
value="{{ producto.descripcion }}"
required>

<input
type="number"
step="0.01"
name="precio"
value="{{ producto.precio }}"
required>

<input
type="number"
name="stock"
value="{{ producto.stock }}"
required>

<button type="submit">

Guardar Cambios

</button>

</form>

<a class="volver" href="/productos/">

← Volver a Productos

</a>

</div>

</body>
</html>
