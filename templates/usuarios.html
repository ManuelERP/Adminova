<!DOCTYPE html>
<html>
<head>
    <title>Adminova Pro</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            background: #0f172a;
            color: white;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #020617;
            padding: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #1e293b;
            color: white;
            transform: translateX(5px);
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 30px;
        }

        /* TOPBAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            animation: fadeIn 1s ease;
        }

        .logout {
            background: #ef4444;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .logout:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        /* CARDS STATS */
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: 0.3s;
            animation: fadeInUp 0.8s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: #334155;
        }

        /* FORM + LIST */
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2563eb;
            transform: scale(1.03);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #334155;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            transition: 0.3s;
        }

        li:hover {
            transform: scale(1.01);
            background: #475569;
        }

        .delete {
            background: #ef4444;
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
        }

        /* ANIMACIONES */
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>🚀 Adminova</h2>
        <a href="/usuarios/">👤 Usuarios</a>
        <a href="/empresas/">🏢 Empresas</a>
        <a href="/ventas/">📊 Ventas</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <h2>Dashboard</h2>
            <a href="/logout/" class="logout">Cerrar sesión</a>
        </div>

        <!-- ESTADÍSTICAS -->
        <div class="stats">
            <div class="stat-card">
                <h3>{{ usuarios|length }}</h3>
                <p>Usuarios</p>
            </div>

            <div class="stat-card">
                <h3>12</h3>
                <p>Empresas</p>
            </div>

            <div class="stat-card">
                <h3>25</h3>
                <p>Ventas</p>
            </div>
        </div>

        <!-- FORM -->
        <div class="card">
            <h3>Crear Usuario</h3>

            <form method="POST">
                {% csrf_token %}
                <input type="text" name="nombre" placeholder="Nombre">
                <input type="email" name="correo" placeholder="Correo">
                <input type="text" name="rol" placeholder="Rol">
                <button type="submit">Guardar</button>
            </form>
        </div>

        <!-- LISTA -->
        <div class="card">
            <h3>Lista de Usuarios</h3>

            <ul>
                {% for usuario in usuarios %}
                <li>
                    {{ usuario.nombre }} - {{ usuario.rol }}
                    <a class="delete" href="/eliminar/{{ usuario.id }}/">Eliminar</a>
                </li>
                {% endfor %}
            </ul>
        </div>

    </div>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
